name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Keep this name stable: the main ruleset requires this check by name, so
    # renaming it would leave every PR waiting for a check that never arrives.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The failure-mode tests run every scenario under Node as well as Bun,
      # and the sidecar itself runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      # Byte budget per package (.size-limit.js): over the limit fails the PR.
      - run: bun run size

      # Unit tests run on the source; test/failure-modes.test.ts runs on the build.
      - run: bun run test
