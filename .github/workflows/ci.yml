name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, build, e2e (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the lowest line that runs sandbox/node-app/e2e.ts: it executes
        # TypeScript directly, which needs type stripping without a flag.
        node: ['22', 'lts/*']

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      # The `moelog` bin of each package points into dist/, which did not exist
      # during the first install, so bun skipped the link. The e2e scripts call
      # node_modules/.bin/moelog, so link again now that dist/ is there.
      - name: Link workspace bins
        run: bun install --frozen-lockfile

      # Both sandboxes: bun-app under Bun, node-app under the Node of the matrix.
      - run: bun run e2e
